plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral().content {
        excludeModule("javax.media", "jai_core")
    }

    maven {
        url 'https://repo.osgeo.org/repository/release/'
        name 'OSGeo Release Repository'
    }
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.json:json:20251224'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'com.jhlabs:filters:2.0.235-1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'io.github.coordinates2country:coordinates2country:1.10'
    implementation 'org.geotools:gt-shapefile:33.2'
    implementation 'org.locationtech.jts:jts:1.20.0'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'com.github.twitch4j:twitch4j:1.25.0'
    implementation('io.github.husnjak:igdb-api-jvm:1.3.2') {
        exclude group: 'com.github.kittinunf.fuel', module: 'fuel-android'
    }
    implementation 'org.kohsuke:github-api:1.330'
    implementation 'commons-cli:commons-cli:1.11.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    annotationProcessor group: "org.projectlombok", name: "lombok", version: '1.18.44'
    compileOnly group: "org.projectlombok", name: "lombok", version: '1.18.44'
}

tasks.register('execute', JavaExec) {
    setMainClass('dev.turtywurty.turtyapi.TurtyAPI')
    args 'dev'
    classpath = sourceSets.main.runtimeClasspath
}

jar {
    manifest {
        attributes(
                "Implementation-Title": "TurtyAPI",
                "Implementation-Version": "1.0-alpha",
                "Main-Class": "dev.turtywurty.turtyapi.TurtyAPI"
        )
    }
}

shadowJar {
    zip64 true
    mergeServiceFiles()
}

compileJava.options.encoding = "UTF-8"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
